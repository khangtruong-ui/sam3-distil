[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3-distil"
version = "0.1.0"
description = "EfficientSAM3: Distilled, Lightweight SAM3 for Real-Time Promptable Concept Segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "EfficientSAM3 & SAM3-Distil Contributors"},
]
keywords = [
    "segment-anything",
    "sam3",
    "efficient-sam",
    "knowledge-distillation",
    "tinyvit",
    "efficientvit",
    "repvit",
    "mobileclip",
    "lora",
    "qlora",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=1.0.17",
    "numpy>=1.26.0",
    "tqdm",
    "ftfy>=6.1.1",
    "regex",
    "iopath>=0.1.10",
    "typing_extensions",
    "huggingface_hub",
    "Pillow>=9.0.0",
    "matplotlib>=3.5.0",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
lora = [
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
    "transformers>=4.36.0",
]
all = [
    "sam3-distil[dev,lora]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sam3*", "stage1*"]

[tool.setuptools.package-data]
sam3 = ["assets/*", "assets/**/*", "**/*.yaml", "**/*.json"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --ignore=checkpoints --ignore=data"
testpaths = ["tests"]
